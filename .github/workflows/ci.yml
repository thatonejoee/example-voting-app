name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the voting app
        run: docker compose up --build -d --wait --wait-timeout 300

      - name: Cast a vote and check it reaches the database
        run: |
          curl -sS -X POST --data "vote=b" http://localhost:8080 > /dev/null
          for i in $(seq 1 20); do
            count=$(docker compose exec -T db psql -U postgres -tA -c "SELECT COUNT(*) FROM votes WHERE vote='b';" 2>/dev/null || echo 0)
            if [ "${count:-0}" -ge 1 ]; then
              echo "Vote reached the database"
              exit 0
            fi
            sleep 3
          done
          echo "Vote never reached the database"
          exit 1

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs

      - name: Stop the app
        if: always()
        run: docker compose down -v

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/voting-${{ matrix.service }}:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/voting-${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/voting-${{ matrix.service }}:${{ github.sha }}
