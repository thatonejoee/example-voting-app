# Set the image tag at deploy time:  --set global.tag=<commit-sha>
global:
  tag: ""

vote:
  replicaCount: 1
  image:
    repository: thatonejoee/voting-vote
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 5000
    targetPort: 80
    nodePort: 31000

result:
  replicaCount: 1
  image:
    repository: thatonejoee/voting-result
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 5001
    targetPort: 80
    nodePort: 31001

worker:
  replicaCount: 1
  image:
    repository: thatonejoee/voting-worker
    tag: ""
    pullPolicy: IfNotPresent

redis:
  replicaCount: 1
  image:
    repository: redis
    tag: "8.4-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379

db:
  replicaCount: 1
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  env:
    postgresUser: "postgres"
    postgresDb: "postgres"
  service:
    type: ClusterIP
    port: 5432
